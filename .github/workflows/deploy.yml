name: Deploy da página /links para Alphamídia (FTP)

# Todo push na main (inclusive o da rotina semanal de seguidores) publica
# index.html + stats.json em www.diretamentedafronteira.com.br/links/.
# Mesma conta FTP do repo site-fronteira (aponta para public_html); aqui o
# destino é a subpasta links/. Só mexe nos arquivos que ele próprio enviou.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TEM_FTP: ${{ secrets.FTP_PASSWORD != '' }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Conferir antes de enviar
        run: |
          grep -q '</html>' index.html || { echo "::error::index.html truncado"; exit 1; }
          python3 -c "import json;d=json.load(open('stats.json'));assert all(d[k]>0 for k in ('tiktok','instagram','youtube'))"
          echo "Tudo certo."

      - name: Sem senha do FTP ainda — deploy pulado
        if: env.TEM_FTP != 'true'
        run: |
          echo "::warning::Segredo FTP_PASSWORD não configurado. Rode: gh secret set FTP_PASSWORD --repo scrincwb/links"

      # Migração p/ o VPS (22/10/2026): FTP ligado enquanto a variável DEPLOY_FTP não for '0'.
      - name: Enviar arquivos por FTP
        if: env.TEM_FTP == 'true' && vars.DEPLOY_FTP != '0'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./links/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            update_stats.py
            **/*.md
            **/.DS_Store

      # ── VPS novo (Hestia, 200.141.21.110) por rsync/SSH ── DESLIGADO por padrão (migração 22/10/2026).
      # Liga com a variável do repositório DEPLOY_VPS=1. Segredos: VPS_HOST, VPS_USER (ddf), VPS_SSH_KEY (chave só
      # de deploy: no servidor só roda `rrsync -wo -no-del /home/ddf/web`) e VPS_KNOWN_HOSTS.
      # Destino: <docroot do www>/links/. Sem --delete (o docroot do www é dividido com outros repos).
      - name: Enviar para o VPS (rsync)
        if: vars.DEPLOY_VPS == '1'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          # caminho RELATIVO a /home/ddf/web (raiz do rrsync): docroot do www
          VPS_DIR: ${{ vars.VPS_DIR || 'diretamentedafronteira.com.br/public_html' }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_VPS=1 mas faltam os segredos VPS_HOST / VPS_SSH_KEY / VPS_KNOWN_HOSTS"; exit 1
          fi
          install -d -m 700 ~/.ssh
          ( umask 077; printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy; printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/vps_known_hosts )
          SSH="ssh -i $HOME/.ssh/vps_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/vps_known_hosts -o ConnectTimeout=20"
          rsync -rltz --chmod=D755,F644 --exclude='.git' --exclude='.git*' --exclude='/.github/' --exclude='/update_stats.py' --exclude='*.md' --exclude='.DS_Store' --exclude='.ftp-deploy-sync-state*.json' --itemize-changes -e "$SSH" ./ "${VPS_USER:-ddf}@$VPS_HOST:${VPS_DIR%/}/links/"
          rm -f ~/.ssh/vps_deploy
